schema_version: 1

context:
  name: dogpile.cache
  version: "1.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dogpile_cache-${{ version }}.tar.gz
  sha256: 849c5573c9a38f155cd4173103c702b637ede0361c12e864876877d0cd125eec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
  run:
    - decorator >=4.0.0
    - python >=${{ python_min }}
    - stevedore >=3.0.0
    - typing_extensions >=4.0.1

tests:
  - python:
      imports:
        - dogpile
        - dogpile.cache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A caching front-end based on the Dogpile lock.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/sqlalchemy/dogpile.cache
  documentation: https://pythonhosted.org/dogpile.cache/

extra:
  recipe-maintainers:
    - asford
    - brainstorm
    - mgorny
